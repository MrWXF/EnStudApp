server:
  port: 8085

spring:
  config:
    import: optional:classpath:application-common.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
  application:
    name: enstud-translate-service
knife4j:
  enable: true
  setting:
    language: zh_cn
logging:
  level:
    com.enstud.translate: DEBUG
