name: EnStudApp CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean compile -DskipTests -q
        timeout-minutes: 10

      - name: Run Tests (H2 in-memory, no Docker needed)
        run: mvn test -q
        timeout-minutes: 10

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: enstud-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: enstud-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint 2>/dev/null || echo "Lint script not configured, skipping"

      - name: Run MSW Component Tests
        run: npm test
        timeout-minutes: 5

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: enstud-frontend/dist/
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: enstud-frontend/test-results/
          retention-days: 7

  integration:
    name: Integration Test (API Smoke)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: enstud_app
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Initialize Database
        run: |
          for f in sql/init/*.sql; do
            mysql -h 127.0.0.1 -P 13306 -uroot -proot enstud_app < "$f" 2>/dev/null || true
          done

      - name: Build Backend
        run: mvn clean package -DskipTests -q
        timeout-minutes: 10

      - name: Start user-service (skip Nacos via test profile)
        run: |
          java -jar enstud-user-service/target/*.jar \
            --spring.profiles.active=test \
            --spring.datasource.url=jdbc:mysql://127.0.0.1:13306/enstud_app?useSSL=false \
            --spring.datasource.username=root \
            --spring.datasource.password=root \
            --spring.data.redis.host=127.0.0.1 \
            --spring.data.redis.port=6379 \
            > /tmp/user-service.log 2>&1 &
          echo "user-service PID: $!"

      - name: Wait & Smoke Test
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/actuator/health > /dev/null 2>&1; then
              echo "user-service is UP"
              break
            fi
            sleep 2
          done
          echo "=== Test Registration ==="
          curl -fsS -X POST http://localhost:8081/user/register \
            -H "Content-Type: application/json" \
            -d '{"username":"testuser","password":"Test@1234","email":"test@example.com"}'
          echo ""
          echo "=== Test Login ==="
          curl -fsS -X POST http://localhost:8081/user/login \
            -H "Content-Type: application/json" \
            -d '{"username":"testuser","password":"Test@1234"}'
