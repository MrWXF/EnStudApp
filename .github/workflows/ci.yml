name: EnStudApp CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean compile -DskipTests -q
        timeout-minutes: 10

      - name: Run Tests & Coverage Check
        run: mvn verify
        timeout-minutes: 10

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-reports
          path: |
            **/target/site/jacoco/
          retention-days: 7

      - name: Upload Checkstyle Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-checkstyle-reports
          path: |
            **/target/checkstyle-result.xml
            **/target/site/checkstyle.html
          retention-days: 7

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: enstud-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: enstud-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Run MSW Component Tests
        run: npm test
        timeout-minutes: 5

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: enstud-frontend/dist/
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: enstud-frontend/test-results/
          retention-days: 7

  vulnerability-scan:
    name: Dependency Vulnerability Scan
    needs: [backend]
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run OWASP Dependency Check
        run: mvn dependency-check:check -DskipTests -q
        timeout-minutes: 15
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY || '' }}

      - name: Upload Dependency Check Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: |
            **/target/dependency-check-report.html
            **/target/dependency-check-report.json
          retention-days: 7

  integration:
    name: Integration Test (API Smoke)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: enstud_app
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Initialize Database
        run: |
          for f in sql/init/*.sql; do
            mysql -h 127.0.0.1 -P 13306 -uroot -proot enstud_app < "$f" 2>/dev/null || true
          done
          for f in sql/migrations/*.sql; do
            mysql -h 127.0.0.1 -P 13306 -uroot -proot enstud_app < "$f" 2>/dev/null || true
          done
          # Seed test data: forum categories
          mysql -h 127.0.0.1 -P 13306 -uroot -proot enstud_app -e "
            INSERT IGNORE INTO enstud_forum_category (id, name, description, sort_order) VALUES (1, '学习经验', '方法分享', 1);
            INSERT IGNORE INTO enstud_forum_category (id, name, description, sort_order) VALUES (2, '问答求助', '问题交流', 3);
          " 2>/dev/null || true
          # Seed test data: wordbook
          mysql -h 127.0.0.1 -P 13306 -uroot -proot enstud_app -e "
            INSERT IGNORE INTO enstud_wordbook (id, name, category, difficulty, word_count, sort_order) VALUES (1, 'CET4', 'CET4', 1, 10, 1);
            INSERT IGNORE INTO enstud_word (id, word, definition_cn, difficulty_level, wordbook_id) VALUES (1, 'abandon', '放弃', 1, 1);
          " 2>/dev/null || true

      - name: Build Backend
        run: mvn clean package -DskipTests -q
        timeout-minutes: 10

      - name: Start user-service (skip Nacos via test profile)
        run: |
          java -jar enstud-user-service/target/*.jar \
            --spring.profiles.active=test \
            --spring.datasource.url=jdbc:mysql://127.0.0.1:13306/enstud_app?useSSL=false \
            --spring.datasource.username=root \
            --spring.datasource.password=root \
            --spring.data.redis.host=127.0.0.1 \
            --spring.data.redis.port=6379 \
            > /tmp/user-service.log 2>&1 &
          echo "user-service PID: $!"

      - name: Start word-service
        run: |
          java -jar enstud-word-service/target/*.jar \
            --spring.profiles.active=test \
            --spring.datasource.url=jdbc:mysql://127.0.0.1:13306/enstud_app?useSSL=false \
            --spring.datasource.username=root \
            --spring.datasource.password=root \
            > /tmp/word-service.log 2>&1 &
          echo "word-service PID: $!"

      - name: Start forum-service
        run: |
          java -jar enstud-forum-service/target/*.jar \
            --spring.profiles.active=test \
            --spring.datasource.url=jdbc:mysql://127.0.0.1:13306/enstud_app?useSSL=false \
            --spring.datasource.username=root \
            --spring.datasource.password=root \
            --spring.data.redis.host=127.0.0.1 \
            --spring.data.redis.port=6379 \
            > /tmp/forum-service.log 2>&1 &
          echo "forum-service PID: $!"

      - name: Wait & Multi-Service Smoke Test
        run: |
          # --- user-service ---
          echo "=== user-service ==="
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/actuator/health > /dev/null 2>&1; then
              echo "✓ user-service UP"
              break
            fi
            sleep 2
          done
          echo "Test Registration..."
          curl -fsS -X POST http://localhost:8081/user/register \
            -H "Content-Type: application/json" \
            -d '{"username":"smokeuser","password":"Smoke@1234","email":"smoke@test.com"}'
          echo ""
          echo "Test Login..."
          curl -fsS -X POST http://localhost:8081/user/login \
            -H "Content-Type: application/json" \
            -d '{"username":"smokeuser","password":"Smoke@1234"}'
          echo ""

          # --- word-service ---
          echo "=== word-service ==="
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8082/actuator/health > /dev/null 2>&1; then
              echo "✓ word-service UP"
              break
            fi
            sleep 2
          done
          echo "Test Wordbooks..."
          curl -fsS http://localhost:8082/word/wordbooks \
            -H "X-User-Id: 1" -H "X-Username: smokeuser"
          echo ""

          # --- forum-service ---
          echo "=== forum-service ==="
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8086/actuator/health > /dev/null 2>&1; then
              echo "✓ forum-service UP"
              break
            fi
            sleep 2
          done
          echo "Test Categories..."
          curl -fsS http://localhost:8086/forum/categories
          echo ""
          echo "Test Posts..."
          curl -fsS http://localhost:8086/forum/posts
          echo ""

          echo ""
          echo "=== All Smoke Tests PASSED ==="
