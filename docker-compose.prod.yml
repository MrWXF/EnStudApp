# ============================================================
# EnStudApp 生产覆盖配置
#
# 用法（叠加在 docker-compose.yml 之上）：
#   首次/本地构建：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   拉取镜像部署：IMAGE_TAG=v1.2.0 docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
#
# 说明：
#   - 应用镜像统一指向 ghcr.io/mrwxf/enstudapp/<name>:${IMAGE_TAG}
#     容器名与基础编排一致（content-service ← forum-service 镜像，ai-service ← chat-service 镜像）
#   - restart: always + 资源限制 + 日志轮转
#   - HTTPS 待域名/证书就绪后，在此挂载 nginx/nginx.prod.conf 与证书目录
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-default-jvm: &default-jvm-env
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -Xss512k"

services:
  # ==================== 应用服务 ====================
  user-service:
    image: ghcr.io/mrwxf/enstudapp/user-service:${IMAGE_TAG:-latest}
    restart: always
    environment:
      <<: *default-jvm-env
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.3"
          memory: 512m
    logging: *default-logging

  content-service:
    image: ghcr.io/mrwxf/enstudapp/forum-service:${IMAGE_TAG:-latest}
    restart: always
    environment:
      <<: *default-jvm-env
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.3"
          memory: 512m
    logging: *default-logging

  ai-service:
    image: ghcr.io/mrwxf/enstudapp/chat-service:${IMAGE_TAG:-latest}
    restart: always
    environment:
      <<: *default-jvm-env
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.3"
          memory: 512m
    logging: *default-logging

  gateway:
    image: ghcr.io/mrwxf/enstudapp/gateway:${IMAGE_TAG:-latest}
    restart: always
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -Xss512k"
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 768m
        reservations:
          cpus: "0.2"
          memory: 384m
    logging: *default-logging

  nginx:
    image: ghcr.io/mrwxf/enstudapp/nginx:${IMAGE_TAG:-latest}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 128m
    logging: *default-logging

  # ==================== 监控 ====================
  prometheus:
    restart: always
    logging: *default-logging

  grafana:
    restart: always
    logging: *default-logging
