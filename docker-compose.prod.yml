# EnStudApp — 生产环境覆盖配置
# 使用方式：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 注意：
#   - ${IMAGE_TAG:-latest} 用于控制部署版本，默认 latest
#   - 生产密钥通过 .env 文件注入，.env 不提交 Git

services:
  user-service:
    # 生产环境：仅拉取镜像（使用 docker compose pull + up -d --no-build）
    image: ghcr.io/${GHCR_REPO:-enstudapp}/user-service:${IMAGE_TAG:-latest}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  word-service:
    image: ghcr.io/${GHCR_REPO:-enstudapp}/word-service:${IMAGE_TAG:-latest}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  chat-service:
    image: ghcr.io/${GHCR_REPO:-enstudapp}/chat-service:${IMAGE_TAG:-latest}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  writing-service:
    image: ghcr.io/${GHCR_REPO:-enstudapp}/writing-service:${IMAGE_TAG:-latest}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  translate-service:
    image: ghcr.io/${GHCR_REPO:-enstudapp}/translate-service:${IMAGE_TAG:-latest}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  forum-service:
    image: ghcr.io/${GHCR_REPO:-enstudapp}/forum-service:${IMAGE_TAG:-latest}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  gateway:
    image: ghcr.io/${GHCR_REPO:-enstudapp}/gateway:${IMAGE_TAG:-latest}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  nginx:
    image: ghcr.io/${GHCR_REPO:-enstudapp}/nginx:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 生产 Nginx 配置（含 HTTPS）
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # SSL 证书（使用 certbot 获取后放置于此处）
      - ${SSL_CERTS_DIR:-./certs}:/etc/nginx/certs:ro
      # Let's Encrypt webroot 验证目录
      - certbot-webroot:/var/www/certbot:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

# 生产环境额外存储卷
volumes:
  certbot-webroot:
    external: false
