# Promtail 配置 — 日志采集代理
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 采集所有微服务日志文件
  - job_name: enstud-services
    static_configs:
      - targets:
          - localhost
        labels:
          job: enstud-services
          __path__: /logs/*/app.log
    pipeline_stages:
      # 从日志文件路径提取服务名
      - regex:
          expression: '/logs/(?P<service>[^/]+)/app.log'
      - labels:
          service:
      # 解析 JSON 日志格式
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            traceId: traceId
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:

  # 采集 Docker 容器日志（作为备选）
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ['com.docker.compose.project=enstudapp']
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
      - labels:
          level:
