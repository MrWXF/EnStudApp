# EnStudApp — Nginx 生产配置（含 HTTPS）
# 用法：
#   1. 替换 ${DOMAIN}、${SSL_CERT_PATH}、${SSL_KEY_PATH}
#   2. docker compose 挂载证书目录到 /etc/nginx/certs
#
# 获取证书：
#   certbot certonly --webroot -w /usr/share/nginx/html -d your-domain.com

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Gzip 压缩
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # 上游网关集群
    upstream gateway {
        server enstud-gateway:8080;
    }

    # HTTP → HTTPS 重定向
    server {
        listen 80;
        server_name ${DOMAIN:-localhost};
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name ${DOMAIN:-localhost};

        # SSL 证书
        ssl_certificate     ${SSL_CERT_PATH:-/etc/nginx/certs/fullchain.pem};
        ssl_certificate_key ${SSL_KEY_PATH:-/etc/nginx/certs/privkey.pem};

        # SSL 安全配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # 安全头
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;

        # 前端静态资源
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # API 请求转发到网关
        location /api/ {
            proxy_pass http://gateway/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 直接服务路径也转发（兼容不通过 /api 前缀的请求）
        location ~ ^/(user|word|chat|writing|translate|forum)/ {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Actuator 健康检查（仅内网访问）
        location /actuator/ {
            allow 127.0.0.1;
            allow 172.20.0.0/16;
            deny all;
            proxy_pass http://gateway/actuator/;
            proxy_set_header Host $host;
        }
    }
}
