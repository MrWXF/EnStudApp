server:
  port: 8080

spring:
  config:
    import: optional:classpath:application-common.yml
  application:
    name: enstud-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yaml
        refresh-enabled: true
        import-check:
          enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 鐢ㄦ埛鏈嶅姟
        - id: user-service
          uri: lb://enstud-user-service
          predicates:
            - Path=/user/**
        # 鍗曡瘝鏈嶅姟
        - id: word-service
          uri: lb://enstud-content-service
          predicates:
            - Path=/word/**
        # AI 瀵硅瘽鏈嶅姟
        - id: chat-service
          uri: lb://enstud-ai-service
          predicates:
            - Path=/chat/**
        # 鍐欎綔鏈嶅姟
        - id: writing-service
          uri: lb://enstud-content-service
          predicates:
            - Path=/writing/**
        # 缈昏瘧鏈嶅姟
        - id: translate-service
          uri: lb://enstud-ai-service
          predicates:
            - Path=/translate/**
        # 璁哄潧鏈嶅姟
        - id: forum-service
          uri: lb://enstud-content-service
          predicates:
            - Path=/forum/**
        # 闃呰鏈嶅姟
        - id: read-service
          uri: lb://enstud-content-service
          predicates:
            - Path=/read/**
      # 鍏ㄥ眬 CORS 閰嶇疆
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# JWT 閰嶇疆
jwt:
  secret: ${JWT_SECRET:enstud-app-jwt-secret-key-2024-production-must-change}

# 涓嶉渶瑕侀壌鏉冪殑璺緞锛堢櫧鍚嶅崟锛?
gateway:
  white-list: /user/register,/user/login,/api/user/register,/api/user/login,/forum/categories,/forum/posts,/read/articles,/writing/topics,/actuator/health

# 鏃ュ織
logging:
  level:
    com.enstud.gateway: DEBUG

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

