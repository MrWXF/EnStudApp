# EnStudApp — Docker Compose 编排
# 基础设施（MySQL/Redis/Nacos/ES）已独立运行，此处只编排微服务 + 网关 + Nginx
#
# 用法：
#   开发环境：docker compose up -d
#   生产环境：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # ==================== 微服务（无依赖，可并行启动） ====================
  user-service:
    build:
      context: .
      dockerfile: enstud-user-service/Dockerfile
    container_name: enstud-user-service
    restart: unless-stopped
    environment:
      - NACOS_SERVER_ADDR=enstud-nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://enstud-mysql:3306/enstud_app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - SPRING_DATA_REDIS_HOST=enstud-redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-enstud-app-jwt-secret-key-2024-production-must-change}
      - SERVICE_WORD=http://enstud-word-service:8082
      - SERVICE_READ=http://enstud-word-service:8082
      - SERVICE_WRITING=http://enstud-writing-service:8084
      - SERVICE_CHAT=http://enstud-chat-service:8083
      - SERVICE_FORUM=http://enstud-forum-service:8086
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    volumes:
      - ./logs/user-service:/app/logs/enstud-user-service
    networks:
      enstud-network:
        ipv4_address: 172.20.0.20

  word-service:
    build:
      context: .
      dockerfile: enstud-word-service/Dockerfile
    container_name: enstud-word-service
    restart: unless-stopped
    environment:
      - NACOS_SERVER_ADDR=enstud-nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://enstud-mysql:3306/enstud_app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - SPRING_DATA_REDIS_HOST=enstud-redis
      - SPRING_DATA_REDIS_PORT=6379
    ports:
      - "${WORD_SERVICE_PORT:-8082}:8082"
    volumes:
      - ./logs/word-service:/app/logs/enstud-word-service
    networks:
      enstud-network:
        ipv4_address: 172.20.0.21

  chat-service:
    build:
      context: .
      dockerfile: enstud-chat-service/Dockerfile
    container_name: enstud-chat-service
    restart: unless-stopped
    environment:
      - NACOS_SERVER_ADDR=enstud-nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://enstud-mysql:3306/enstud_app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - SPRING_DATA_REDIS_HOST=enstud-redis
      - SPRING_DATA_REDIS_PORT=6379
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
    ports:
      - "${CHAT_SERVICE_PORT:-8083}:8083"
    volumes:
      - ./logs/chat-service:/app/logs/enstud-chat-service
    networks:
      enstud-network:
        ipv4_address: 172.20.0.22

  writing-service:
    build:
      context: .
      dockerfile: enstud-writing-service/Dockerfile
    container_name: enstud-writing-service
    restart: unless-stopped
    environment:
      - NACOS_SERVER_ADDR=enstud-nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://enstud-mysql:3306/enstud_app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - SPRING_DATA_REDIS_HOST=enstud-redis
      - SPRING_DATA_REDIS_PORT=6379
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
    ports:
      - "${WRITING_SERVICE_PORT:-8084}:8084"
    volumes:
      - ./logs/writing-service:/app/logs/enstud-writing-service
    networks:
      enstud-network:
        ipv4_address: 172.20.0.23

  translate-service:
    build:
      context: .
      dockerfile: enstud-translate-service/Dockerfile
    container_name: enstud-translate-service
    restart: unless-stopped
    environment:
      - NACOS_SERVER_ADDR=enstud-nacos:8848
      - SPRING_DATA_REDIS_HOST=enstud-redis
      - SPRING_DATA_REDIS_PORT=6379
    ports:
      - "${TRANSLATE_SERVICE_PORT:-8085}:8085"
    volumes:
      - ./logs/translate-service:/app/logs/enstud-translate-service
    networks:
      enstud-network:
        ipv4_address: 172.20.0.24

  forum-service:
    build:
      context: .
      dockerfile: enstud-forum-service/Dockerfile
    container_name: enstud-forum-service
    restart: unless-stopped
    environment:
      - NACOS_SERVER_ADDR=enstud-nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://enstud-mysql:3306/enstud_app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - SPRING_DATA_REDIS_HOST=enstud-redis
      - SPRING_DATA_REDIS_PORT=6379
    ports:
      - "${FORUM_SERVICE_PORT:-8086}:8086"
    volumes:
      - ./logs/forum-service:/app/logs/enstud-forum-service
    networks:
      enstud-network:
        ipv4_address: 172.20.0.25

  read-service:
    build:
      context: .
      dockerfile: enstud-read-service/Dockerfile
    container_name: enstud-read-service
    restart: unless-stopped
    environment:
      - NACOS_SERVER_ADDR=enstud-nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://enstud-mysql:3306/enstud_app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - SPRING_DATA_REDIS_HOST=enstud-redis
      - SPRING_DATA_REDIS_PORT=6379
    ports:
      - "${READ_SERVICE_PORT:-8087}:8087"
    volumes:
      - ./logs/read-service:/app/logs/enstud-read-service
    networks:
      enstud-network:
        ipv4_address: 172.20.0.26

  # ==================== API 网关 ====================
  gateway:
    build:
      context: .
      dockerfile: enstud-gateway/Dockerfile
    container_name: enstud-gateway
    restart: unless-stopped
    environment:
      - NACOS_SERVER_ADDR=enstud-nacos:8848
      - REDIS_HOST=enstud-redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-enstud-app-jwt-secret-key-2024-production-must-change}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      user-service:
        condition: service_healthy
      word-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      writing-service:
        condition: service_healthy
      translate-service:
        condition: service_healthy
      forum-service:
        condition: service_healthy
      read-service:
        condition: service_healthy
    networks:
      enstud-network:
        ipv4_address: 172.20.0.30

  # ==================== Nginx ====================
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: enstud-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      enstud-network:
        ipv4_address: 172.20.0.31

  # ==================== 可观测性 ====================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: enstud-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      enstud-network:
        ipv4_address: 172.20.0.40

  grafana:
    image: grafana/grafana:10.4.2
    container_name: enstud-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      enstud-network:
        ipv4_address: 172.20.0.41

  loki:
    image: grafana/loki:3.0.0
    container_name: enstud-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      enstud-network:
        ipv4_address: 172.20.0.42

  promtail:
    image: grafana/promtail:3.0.0
    container_name: enstud-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./logs:/logs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      enstud-network:
        ipv4_address: 172.20.0.43

# ==================== 网络和存储 ====================
networks:
  enstud-network:
    external: true

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
