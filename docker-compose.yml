version: '3.8'

services:
  # ==================== 用户服务（用户+单词）====================
  user-service:
    build:
      context: .
      dockerfile: enstud-user-service/Dockerfile
    container_name: enstud-user-service
    restart: unless-stopped
    environment:
      - NACOS_SERVER_ADDR=enstud-nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://enstud-mysql:3306/enstud_app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - SPRING_DATA_REDIS_HOST=enstud-redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-enstud-app-jwt-secret-key-2024-production-must-change}
      - SERVICE_CONTENT=http://enstud-content-service:8082
      - SERVICE_AI=http://enstud-ai-service:8083
      - SERVICE_WORD=http://enstud-user-service:8081
      - SERVICE_READ=http://enstud-content-service:8082
      - SERVICE_WRITING=http://enstud-content-service:8082
      - SERVICE_CHAT=http://enstud-ai-service:8083
      - SERVICE_FORUM=http://enstud-content-service:8082
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    volumes:
      - ./logs/user-service:/app/logs/enstud-user-service
    networks:
      enstud-network:
        ipv4_address: 172.20.0.20

  # ==================== 内容服务（论坛+阅读+写作）====================
  content-service:
    build:
      context: .
      dockerfile: enstud-forum-service/Dockerfile
    container_name: enstud-content-service
    restart: unless-stopped
    environment:
      - NACOS_SERVER_ADDR=enstud-nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://enstud-mysql:3306/enstud_app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - SPRING_DATA_REDIS_HOST=enstud-redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-enstud-app-jwt-secret-key-2024-production-must-change}
      - SERVICE_USER=http://enstud-user-service:8081
      - SERVICE_WORD=http://enstud-user-service:8081
      - SERVICE_READ=http://enstud-content-service:8082
      - SERVICE_WRITING=http://enstud-content-service:8082
    ports:
      - "${CONTENT_SERVICE_PORT:-8082}:8082"
    volumes:
      - ./logs/content-service:/app/logs/enstud-content-service
    networks:
      enstud-network:
        ipv4_address: 172.20.0.21

  # ==================== AI 服务（聊天+翻译）====================
  ai-service:
    build:
      context: .
      dockerfile: enstud-chat-service/Dockerfile
    container_name: enstud-ai-service
    restart: unless-stopped
    environment:
      - NACOS_SERVER_ADDR=enstud-nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://enstud-mysql:3306/enstud_app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - SPRING_DATA_REDIS_HOST=enstud-redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-enstud-app-jwt-secret-key-2024-production-must-change}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_CHAT_DAILY_LIMIT=${DEEPSEEK_CHAT_DAILY_LIMIT:-50}
      - DEEPSEEK_WRITING_DAILY_LIMIT=${DEEPSEEK_WRITING_DAILY_LIMIT:-10}
      - DEEPSEEK_TRANSLATE_DAILY_LIMIT=${DEEPSEEK_TRANSLATE_DAILY_LIMIT:-100}
    ports:
      - "${AI_SERVICE_PORT:-8083}:8083"
    volumes:
      - ./logs/ai-service:/app/logs/enstud-ai-service
    networks:
      enstud-network:
        ipv4_address: 172.20.0.22

  # ==================== API 网关 ====================
  gateway:
    build:
      context: .
      dockerfile: enstud-gateway/Dockerfile
    container_name: enstud-gateway
    restart: unless-stopped
    environment:
      - NACOS_SERVER_ADDR=enstud-nacos:8848
      - REDIS_HOST=enstud-redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-enstud-app-jwt-secret-key-2024-production-must-change}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - user-service
      - content-service
      - ai-service
    networks:
      enstud-network:
        ipv4_address: 172.20.0.30

  # ==================== Nginx ====================
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: enstud-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      enstud-network:
        ipv4_address: 172.20.0.31

  # ==================== 可观测性 ====================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: enstud-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      enstud-network:
        ipv4_address: 172.20.0.40

  grafana:
    image: grafana/grafana:10.4.2
    container_name: enstud-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      enstud-network:
        ipv4_address: 172.20.0.41

networks:
  enstud-network:
    external: true

volumes:
  prometheus-data:
  grafana-data:
