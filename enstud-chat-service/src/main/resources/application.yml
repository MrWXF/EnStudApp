server:
  port: 8083

spring:
  config:
    import: optional:classpath:application-common.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
  application:
    name: enstud-ai-service
knife4j:
  enable: true
  setting:
    language: zh_cn
logging:
  level:
    com.enstud.translate: DEBUG

# AI 配置（true=Mock 客户端，false/缺省=DeepSeek 真实客户端）
ai:
  mock: false

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: deepseek-chat
  timeout: 60

